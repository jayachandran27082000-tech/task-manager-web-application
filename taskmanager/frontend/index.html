<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface2: #222228;
      --border: #2e2e38;
      --accent: #7c6af7;
      --accent-dim: #7c6af720;
      --green: #3ecf8e;
      --red: #f87171;
      --text: #e8e8f0;
      --muted: #7a7a8c;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 62px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    #nav-user {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    #nav-username { font-size: 0.875rem; color: var(--muted); }
    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.35rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ── LAYOUT ── */
    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    /* ── AUTH PAGES ── */
    .auth-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 3rem 1.5rem;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }
    .auth-card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.75rem;
      margin-bottom: 0.25rem;
    }
    .auth-card .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .auth-card .sub a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    /* ── FORM ELEMENTS ── */
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.02em; text-transform: uppercase; }
    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { background: #9485f9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── TASK UI ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
    }

    /* Add task */
    .add-task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.75rem;
    }
    .add-task-card h3 { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .add-task-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .add-task-row input { flex: 1; min-width: 180px; }
    .btn-add { background: var(--accent); color: #fff; padding: 0.65rem 1.2rem; border-radius: 8px; border: none; font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-add:hover { background: #9485f9; }

    /* Filters */
    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .filter-btn:hover:not(.active) { border-color: var(--muted); color: var(--text); }

    /* Task list */
    #task-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: border-color 0.15s, opacity 0.2s;
      animation: slideIn 0.2s ease;
    }
    .task-card:hover { border-color: #3e3e50; }
    .task-card.done { opacity: 0.55; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .task-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .task-check:hover { border-color: var(--green); }
    .task-check.checked { background: var(--green); border-color: var(--green); }
    .task-check.checked::after { content: '✓'; color: #fff; font-size: 0.7rem; font-weight: 700; }

    .task-body { flex: 1; min-width: 0; }
    .task-title { font-weight: 500; font-size: 0.95rem; line-height: 1.4; }
    .task-title.done-text { text-decoration: line-through; color: var(--muted); }
    .task-desc { font-size: 0.82rem; color: var(--muted); margin-top: 0.2rem; }
    .task-meta { font-size: 0.75rem; color: var(--border); margin-top: 0.3rem; }

    .task-actions { display: flex; gap: 0.4rem; }
    .btn-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .btn-del { color: var(--muted); }
    .btn-del:hover { border-color: var(--red); color: var(--red); background: #f8717115; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1.75rem; }
    .page-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-btn.current { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .page-info { font-size: 0.82rem; color: var(--muted); }

    /* Empty / loading / error */
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-size: 0.875rem;
      z-index: 999;
      animation: fadeUp 0.2s ease;
      max-width: 320px;
    }
    .toast.success { background: #1a2e24; border: 1px solid var(--green); color: var(--green); }
    .toast.error { background: #2e1a1a; border: 1px solid var(--red); color: var(--red); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    /* Responsive */
    @media (max-width: 540px) {
      nav { padding: 0 1rem; }
      .auth-card { padding: 1.75rem 1.25rem; }
      .add-task-row { flex-direction: column; }
      .btn-add { width: 100%; }
    }

    /* Hidden utility */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<nav>
  <div class="logo">TaskFlow</div>
  <div id="nav-user" class="hidden">
    <span id="nav-username"></span>
    <button class="btn-ghost" onclick="logout()">Sign out</button>
  </div>
</nav>

<!-- AUTH SECTION -->
<div id="auth-section" class="auth-wrap">

  <!-- Login -->
  <div id="login-card" class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">New here? <a onclick="showRegister()">Create an account</a></p>
    <div class="field"><label>Username</label><input id="login-username" type="text" placeholder="your_username" autocomplete="username" /></div>
    <div class="field"><label>Password</label><input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" /></div>
    <div id="login-error" style="color:var(--red);font-size:0.85rem;margin-bottom:0.75rem;display:none"></div>
    <button class="btn btn-primary" id="login-btn" onclick="login()">Sign in</button>
  </div>

  <!-- Register -->
  <div id="register-card" class="auth-card hidden">
    <h2>Create account</h2>
    <p class="sub">Already have one? <a onclick="showLogin()">Sign in</a></p>
    <div class="field"><label>Username</label><input id="reg-username" type="text" placeholder="your_username" autocomplete="username" /></div>
    <div class="field"><label>Email</label><input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" /></div>
    <div class="field"><label>Password</label><input id="reg-password" type="password" placeholder="Min. 6 characters" autocomplete="new-password" /></div>
    <div id="reg-error" style="color:var(--red);font-size:0.85rem;margin-bottom:0.75rem;display:none"></div>
    <button class="btn btn-primary" id="reg-btn" onclick="register()">Create account</button>
  </div>

</div>

<!-- TASKS SECTION -->
<main id="tasks-section" class="hidden">
  <div class="page-header">
    <h1>My Tasks</h1>
    <span id="task-count" style="color:var(--muted);font-size:0.875rem"></span>
  </div>

  <!-- Add task -->
  <div class="add-task-card">
    <h3>New Task</h3>
    <div class="add-task-row">
      <input id="new-title" type="text" placeholder="What needs to be done?" />
      <button class="btn-add" onclick="createTask()">+ Add</button>
    </div>
    <div style="margin-top:0.75rem;">
      <input id="new-desc" type="text" placeholder="Description (optional)" style="font-size:0.85rem;" />
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="filter-btn active" id="f-all" onclick="setFilter(null)">All</button>
    <button class="filter-btn" id="f-pending" onclick="setFilter(false)">Pending</button>
    <button class="filter-btn" id="f-done" onclick="setFilter(true)">Completed</button>
  </div>

  <!-- Task list -->
  <div id="task-list"></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</main>

<script>
  // ── CONFIG ──
  // Change this to your deployed backend URL in production
  const API_BASE = window.location.origin;

  // ── STATE ──
  let token = localStorage.getItem('tm_token') || null;
  let currentUser = localStorage.getItem('tm_username') || null;
  let currentFilter = null;
  let currentPage = 1;
  const PAGE_SIZE = 8;

  // ── INIT ──
  if (token) showTasksView();

  // ── AUTH HELPERS ──
  function showLogin() {
    document.getElementById('login-card').classList.remove('hidden');
    document.getElementById('register-card').classList.add('hidden');
  }
  function showRegister() {
    document.getElementById('register-card').classList.remove('hidden');
    document.getElementById('login-card').classList.add('hidden');
  }
  function showTasksView() {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('tasks-section').classList.remove('hidden');
    document.getElementById('nav-user').classList.remove('hidden');
    document.getElementById('nav-username').textContent = currentUser;
    loadTasks();
  }
  function logout() {
    token = null; currentUser = null;
    localStorage.removeItem('tm_token');
    localStorage.removeItem('tm_username');
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('tasks-section').classList.add('hidden');
    document.getElementById('nav-user').classList.add('hidden');
    showLogin();
  }

  // ── API ──
  async function api(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 204) return null;
    return res.json().then(d => ({ ok: res.ok, status: res.status, data: d }));
  }

  // ── REGISTER ──
  async function register() {
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const errEl = document.getElementById('reg-error');
    errEl.style.display = 'none';

    if (!username || !email || !password) { showErr(errEl, 'All fields are required.'); return; }

    const btn = document.getElementById('reg-btn');
    btn.disabled = true; btn.textContent = 'Creating…';

    const res = await api('POST', '/register', { username, email, password });
    btn.disabled = false; btn.textContent = 'Create account';

    if (!res.ok) {
      showErr(errEl, res.data.detail || 'Registration failed.');
      return;
    }
    toast('Account created! Please sign in.', 'success');
    showLogin();
  }

  // ── LOGIN ──
  async function login() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    if (!username || !password) { showErr(errEl, 'Username and password are required.'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    const res = await api('POST', '/login', { username, password });
    btn.disabled = false; btn.textContent = 'Sign in';

    if (!res.ok) { showErr(errEl, res.data.detail || 'Invalid credentials.'); return; }

    token = res.data.access_token;
    currentUser = username;
    localStorage.setItem('tm_token', token);
    localStorage.setItem('tm_username', username);
    showTasksView();
  }

  // ── TASKS ──
  async function loadTasks() {
    const list = document.getElementById('task-list');
    list.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div>';

    let url = `/tasks?page=${currentPage}&page_size=${PAGE_SIZE}`;
    if (currentFilter !== null) url += `&completed=${currentFilter}`;

    const res = await api('GET', url);
    if (!res || !res.ok) { list.innerHTML = '<div class="empty-state"><p>Failed to load tasks.</p></div>'; return; }

    const { tasks, total, total_pages } = res.data;
    document.getElementById('task-count').textContent = `${total} task${total !== 1 ? 's' : ''}`;

    if (tasks.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>No tasks here yet.</p></div>';
    } else {
      list.innerHTML = tasks.map(t => taskHTML(t)).join('');
    }
    renderPagination(currentPage, total_pages);
  }

  function taskHTML(t) {
    const date = new Date(t.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return `
      <div class="task-card ${t.completed ? 'done' : ''}" id="task-${t.id}">
        <div class="task-check ${t.completed ? 'checked' : ''}" onclick="toggleTask(${t.id}, ${t.completed})" title="${t.completed ? 'Mark incomplete' : 'Mark complete'}"></div>
        <div class="task-body">
          <div class="task-title ${t.completed ? 'done-text' : ''}">${escHtml(t.title)}</div>
          ${t.description ? `<div class="task-desc">${escHtml(t.description)}</div>` : ''}
          <div class="task-meta">Created ${date}</div>
        </div>
        <div class="task-actions">
          <button class="btn-icon btn-del" onclick="deleteTask(${t.id})" title="Delete">🗑</button>
        </div>
      </div>`;
  }

  async function createTask() {
    const title = document.getElementById('new-title').value.trim();
    const description = document.getElementById('new-desc').value.trim();
    if (!title) { toast('Please enter a task title.', 'error'); return; }

    const res = await api('POST', '/tasks', { title, description: description || null });
    if (!res || !res.ok) { toast(res?.data?.detail || 'Failed to create task.', 'error'); return; }

    document.getElementById('new-title').value = '';
    document.getElementById('new-desc').value = '';
    toast('Task added!', 'success');
    currentPage = 1;
    loadTasks();
  }

  async function toggleTask(id, currentlyDone) {
    const res = await api('PUT', `/tasks/${id}`, { completed: !currentlyDone });
    if (!res || !res.ok) { toast('Failed to update task.', 'error'); return; }
    loadTasks();
  }

  async function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    const r = await fetch(`${API_BASE}/tasks/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (r.status === 204 || r.ok) { toast('Task deleted.', 'success'); loadTasks(); }
    else { toast('Failed to delete task.', 'error'); }
  }

  // ── FILTER ──
  function setFilter(val) {
    currentFilter = val;
    currentPage = 1;
    ['f-all','f-pending','f-done'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById(val === null ? 'f-all' : val ? 'f-done' : 'f-pending').classList.add('active');
    loadTasks();
  }

  // ── PAGINATION ──
  function renderPagination(page, total) {
    const el = document.getElementById('pagination');
    if (total <= 1) { el.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="goPage(${page-1})" ${page<=1?'disabled':''}>← Prev</button>`;
    for (let p = 1; p <= total; p++) {
      html += `<button class="page-btn ${p===page?'current':''}" onclick="goPage(${p})">${p}</button>`;
    }
    html += `<button class="page-btn" onclick="goPage(${page+1})" ${page>=total?'disabled':''}>Next →</button>`;
    el.innerHTML = html;
  }
  function goPage(p) { currentPage = p; loadTasks(); }

  // ── UTILITIES ──
  function showErr(el, msg) { el.textContent = msg; el.style.display = 'block'; }
  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function toast(msg, type = 'success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('login-card') && !document.getElementById('login-card').classList.contains('hidden')) login();
      else if (document.getElementById('register-card') && !document.getElementById('register-card').classList.contains('hidden')) register();
      else if (!document.getElementById('tasks-section').classList.contains('hidden') && document.activeElement?.id?.startsWith('new-')) createTask();
    }
  });
</script>
</body>
</html>
